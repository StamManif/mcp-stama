[package]
name = "mcp-stama"
version = "0.1.0"
edition = "2021"


[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
ignore = "0.4"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
regex = "1.10"
gix = "0.66"
bollard = "0.18"
sysinfo = "0.33"
clap = { version = "4.5", features = ["derive"] }




[dev-dependencies]
tempfile = "3.10"

[profile.release]

opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
